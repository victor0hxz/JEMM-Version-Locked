plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.146'
}
java.toolchain.languageVersion = JavaLanguageVersion.of(25)
group = maven_group
version = "${mc_version}-${mod_version}-atm11-0.9.0"
base.archivesName = archives_base_name
repositories {
    mavenCentral()
    maven { url 'https://maven.blamejared.com' }
    maven { url 'https://modmaven.dev' }
}
neoForge {
    version = neoforge_api_version
    mods { jei_mekanism_multiblocks { sourceSet sourceSets.main } }
    runs {
        client { client(); gameDirectory = file('run/client') }
        server { server(); gameDirectory = file('run/server'); programArguments.add('--nogui') }
    }
}
dependencies {
    def mek = files(fileTree('libs') { include '*Mekanism*.jar' })
    implementation(mek)
    implementation files(fileTree('libs'){include 'jei-*.jar'})
    compileOnly 'org.jetbrains:annotations:26.0.1'
}
sourceSets.main.resources.srcDir 'src/generated/resources'
processResources {
    def props = [mc_version:mc_version, mod_id:mod_id, mod_version:mod_version, mod_name:mod_name, mod_description:mod_description,
      mod_license:mod_license, mod_homepage:mod_homepage, mod_source:mod_source, mod_issues:mod_issues,
      neoforge_api_version:neoforge_api_version, neoforge_api_version_range:neoforge_api_version_range,
      neoforge_loader_version:neoforge_loader_version, mekanism_version_range:mekanism_version_range]
    inputs.properties props
    filesMatching(['META-INF/neoforge.mods.toml', '*.json']) { expand props }
}
tasks.withType(JavaCompile).configureEach { options.encoding='UTF-8'; options.compilerArgs += ['-Xmaxerrs','1000'] }
tasks.named('downloadAssets') {
    javaExecutable.set(javaToolchains.launcherFor { languageVersion=JavaLanguageVersion.of(25) }.map { it.executablePath.asFile.absolutePath })
}

tasks.named('jar', Jar) {
 from('LICENSE') { into 'META-INF'; rename { 'LICENSE-JEMM' } }
}
